{% extends "layouts/base.html" %}
{% set project = "Admin Login" %}

{% block body %}
<div class="fa-wrap">
    <div class="card fa-login">
        <div class="card-body">
            <p class="fa-kicker">Backend</p>
            <h1>Admin <em>login</em></h1>
            <p style="color:var(--ink-2)">For site administrators and volunteers. Community members sign in on the website.</p>

            {% if error %}<div class="fa-alert error" role="alert">{{ error }}</div>{% endif %}
            {% if logout %}<div class="fa-alert ok" role="status">You have been logged out.</div>{% endif %}

            <form name="f" action="{{ url_for('login') }}" method="POST">
                <label for="username">User ID</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required>
                <label for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                <!-- Hidden input for 'next' page, which is set on unauthorized redirects -->
                <input type="hidden" name="next" value="{{ next }}">
                <button class="btn btn-primary btn-lg w-100" type="submit">Log in</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
