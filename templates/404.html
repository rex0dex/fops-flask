{% extends "layouts/base.html" %}
{% set project = "Page Not Found" %}

{% block body %}
<div class="fa-wrap">
    <section class="fa-hero" style="text-align:center">
        <p class="fa-kicker">404</p>
        <h1>We couldn't find <em>that page</em></h1>
        <p style="margin:0 auto 1.5rem">The link may be old, or the page may have moved.</p>
        <a class="fa-btn fa-btn-primary" href="{{ url_for('index') }}">Back to the backend home</a>
    </section>
</div>
{% endblock %}
